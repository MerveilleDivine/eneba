name: Engineering checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17.12", "18.7"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-admin
      PGDATABASE: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: npm ci
      - run: npm run db:provision
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run verify
      - run: npm run audit
      - run: npm run test:integration
      - run: npm run test:browser
      - name: Preserve reviewer-visible homepage screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homepage-3e-postgres-${{ matrix.postgres }}
          path: test-results/**/homepage-*.jpg
          if-no-files-found: warn
          retention-days: 7
      - name: Go race checks
        run: node scripts/run-go.mjs test -race -tags=integration -p 1 ./... -count=1
