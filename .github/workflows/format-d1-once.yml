name: Format D1 tests once

on:
  push:
    branches:
      - feature/slice-2-catalog

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write web/src/features/catalog/catalog-api.test.ts
      - name: Commit formatted test and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/features/catalog/catalog-api.test.ts
          git rm .github/workflows/format-d1-once.yml
          git diff --cached --check
          git commit -m "Format D1 response-contract regression tests"
          git push origin HEAD:feature/slice-2-catalog
