name: Format Slice 2 once

on:
  push:
    branches:
      - feature/slice-2-catalog

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prettier --write "web/src/**/*.{ts,tsx,css}" "tests/browser/*.spec.ts"
      - name: Commit formatting and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src tests/browser
          git rm .github/workflows/format-once.yml
          git diff --cached --check
          git commit -m "Format Slice 2 frontend and remove temporary formatter"
          git push origin HEAD:feature/slice-2-catalog
